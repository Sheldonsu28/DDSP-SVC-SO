data:
  f0_extractor: rmvpe
  f0_min: 65
  f0_max: 1060
  sampling_rate: 44100
  volume_smooth_size: 256
  block_size: 512
  duration: 1.5
  encoder: contentvec768l12tta2x
  cnhubertsoft_gate: 10
  encoder_sample_rate: 16000
  encoder_hop_size: 160
  encoder_out_channels: 768
  encoder_ckpt: pretrain/contentvec/pytorch_model.bin
  train_path: data/train
  valid_path: data/val
  extensions:
  - wav
model:
  type: RectifiedFlow
  win_length: 2048
  n_aux_layers: 6
  n_aux_chans: 512
  n_layers: 6
  n_chans: 1024
  t_start: 0.0
  use_norm: true
  use_attention: false
  use_pitch_aug: true
  n_spk: 1
device: cuda
vocoder:
  type: nsf-hifigan
  ckpt: pretrain/nsf_hifigan/model
infer:
  infer_step: 50
  method: euler
env:
  expdir: exp/reflow-test
  gpu_id: 0
  style_dir: exp/frontend
train:
  num_workers: 0
  amp_dtype: bf16
  batch_size: 4
  cache_all_data: true
  cache_device: cpu
  cache_fp16: false
  epochs: 100000
  interval_log: 50
  interval_val: 500
  interval_force_save: 5000
  lr: 0.0005
  decay_step: 4000
  gamma: 0.9
  weight_decay: 0.1
  lambda_ddsp: 1
  save_opt: true
frontend:
  enabled: true
  base_checkpoint: null
  checkpoint: null
  speaker_embedding: null # Optional inference override; default: data.train_path/speaker_means/<spk_id>.npy.
  index_dir: exp/feature_index
  contentvec_index: null
  hubert_index: null
  whisper_index: null
  whisper_ckpt: pretrain/ppg-large/large-v2.pt
  hubert_ckpt: pretrain/hubert/hubert-soft.pt
  speaker_encoder: speechbrain/spkrec-ecapa-voxceleb
  speaker_encoder_cache: cache/speaker_encoder
  model: {}
